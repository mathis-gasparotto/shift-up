services:
  app:
    build:
      context: .
      target: production
      args:
        DOCKER_BUILDKIT: 1
    image: shift-up-app
    env_file:
      - .env.local
      - .env
    container_name: shift-up_app_quasar
    volumes:
      - .:/app:rw
      - /app/node_modules
    ports:
      - '80:80'
