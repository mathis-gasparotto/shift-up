# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $appBackUrl: '%env(APP_BACK_URL)%'
            $appFrontUrl: '%env(APP_FRONT_URL)%'


    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: [ 'controller.service_arguments' ]

    App\Command\Serve:
        arguments:
            $apiIp: '%env(API_IP)%'
            $apiPort: '%env(API_PORT)%'

    App\Service\RepositoryService:
        bind:
            $collectionExtensions: !tagged api_platform.doctrine.orm.query_extension.collection

    App\Serializer\GroupsContextBuilder:
        decorates: 'api_platform.serializer.context_builder'
        arguments: [ '@App\Serializer\GroupsContextBuilder.inner' ]

    App\Serializer\MediaObjectNormalizer:
        arguments:
            $prefixUrl: '%env(MEDIA_STORAGE_PREFIX_URL)%'

    App\EventSubscribers\MediaObjectSubscriber:
        arguments:
            $filterService: '@liip_imagine.service.filter'

    App\Service\OpenAIService:
        arguments:
            $openAIModel: '%env(OPENAI_MODEL)%'
            $openAIInstructModel: '%env(OPENAI_INSTRUCT_MODEL)%'

    App\Service\StripeService:
        arguments:
            $stripeSk: '%env(STRIPE_SECRET_KEY)%'
            $stripeWk: '%env(STRIPE_WEBHOOK_KEY)%'
            $stripeApiVersion: '%env(STRIPE_API_VERSION)%'

    Vich\UploaderBundle\Naming\SlugNamer:
        public: true
        arguments:
            $service: '@App\Repository\MediaObjectRepository'
            $method: findOneByFilePath

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
