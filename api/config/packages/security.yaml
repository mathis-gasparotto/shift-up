security:
    enable_authenticator_manager: true
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
#        users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
#        main:
#            lazy: true
#            provider: users_in_memory
        login:
            pattern: ^/authenticate
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /authenticate
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\Handler\AuthenticationFailureHandler

        api_token_refresh:
            pattern: ^/token/refresh
            stateless: true
            refresh_jwt:
                provider: app_user_provider

        api:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            jwt: ~

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    access_control:
        - { path: ^/docs, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        - { path: ^/_profiler, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        - { path: ^/subscriptions, methods: [ 'GET' ], roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        - { path: ^/authenticate$, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/register$, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/token/refresh$, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/verify_email_register, methods: [ 'GET' ], roles: PUBLIC_ACCESS }
        - { path: ^/send_reset_password, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/reset_password/, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/users$, methods: [ 'POST' ], roles: PUBLIC_ACCESS }
        - { path: ^/test$, methods: [ 'GET' ], roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
