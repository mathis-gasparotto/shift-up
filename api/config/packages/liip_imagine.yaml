# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
  # valid drivers options include "gd" or "gmagick" or "imagick"
  driver: "imagick"
  loaders:
    media:
      flysystem:
        filesystem_service: media.storage
  data_loader: media
  resolvers:
    media:
      flysystem:
        filesystem_service: media.storage
        root_url: "%env(MEDIA_STORAGE_PREFIX_URL)%"
        cache_prefix: cache
        visibility: public
  filter_sets:
    # the name of the "filter set"
    picture_thumb:
      cache: media
      quality: 90
      filters:
        thumbnail: { size: [ 250, 250 ], mode: outbound }
    picture_small:
      cache: media
      quality: 90
      filters:
        thumbnail: { size: [ 500, 500 ], mode: outbound }
    picture_large:
      cache: media
      quality: 90
      filters:
        thumbnail: { size: [ 800, 800 ], mode: outbound }
